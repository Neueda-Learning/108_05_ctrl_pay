name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend Test + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend tests
        run: ./mvnw -B test

      - name: Build backend artifact
        run: ./mvnw -B package -DskipTests

  frontend:
    name: Frontend Test + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Run frontend tests
        env:
          CI: "true"
        run: npm test -- --watch=false --passWithNoTests

      - name: Build frontend
        run: npm run build

  ml:
    name: ML Dependency + Model Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml_fraud-detection/payment-fraud-detection-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml_fraud-detection/payment-fraud-detection-main/requirements.txt

      - name: Install ML dependencies
        run: pip install -r requirements.txt

      - name: Validate ML imports and model loading
        run: |
          python -u -c "import pickle"
          python -u -c "import xgboost, sklearn, numpy, pandas"
          python -u -c "from pathlib import Path; p=Path('XGBoostModel.pkl'); assert p.exists(), 'XGBoostModel.pkl not found'; pickle.load(p.open('rb')); print('Model loaded successfully')"

  docker:
    name: Docker Build + Compose Validation
    runs-on: ubuntu-latest
    needs: [backend, frontend, ml]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t ctrl-pay-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t ctrl-pay-frontend:ci --build-arg REACT_APP_API_URL=/api --build-arg REACT_APP_FRAUD_API_URL=/ml ./frontend

      - name: Build ML image
        run: docker build -t ctrl-pay-ml:ci ./ml_fraud-detection/payment-fraud-detection-main

      - name: Validate compose file
        run: docker compose config -q


