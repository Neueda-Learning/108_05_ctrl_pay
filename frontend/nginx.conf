server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── CORS strategy ────────────────────────────────────────────────────────
    # 1. OPTIONS preflight is answered by nginx directly (backend never sees it).
    # 2. For real requests: Origin header is STRIPPED before forwarding to backend
    #    so Spring Boot's CORS filter does not reject the request.
    # 3. nginx injects Access-Control-Allow-Origin on every proxied response
    #    so the browser is satisfied.
    # ─────────────────────────────────────────────────────────────────────────

    location /api/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'      "$http_origin" always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Origin, Content-Type, Accept, Authorization, Idempotency-Key' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age'           '3600' always;
            add_header 'Content-Length' '0';
            return 204;
        }

        proxy_pass http://backend:8082/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            "";   # strip so Spring Boot CORS filter doesn't reject

        add_header 'Access-Control-Allow-Origin'      "$http_origin" always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    location /actuator/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  "$http_origin" always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept' always;
            add_header 'Content-Length' '0';
            return 204;
        }

        proxy_pass http://backend:8082/actuator/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            "";

        add_header 'Access-Control-Allow-Origin'      "$http_origin" always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    location = /swagger-ui.html {
        proxy_pass http://backend:8082/swagger-ui.html;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            "";
    }

    location /swagger-ui/ {
        proxy_pass http://backend:8082/swagger-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            "";
    }

    location /v3/api-docs {
        proxy_pass http://backend:8082/v3/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            "";
    }

    location /v3/api-docs/ {
        proxy_pass http://backend:8082/v3/api-docs/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            "";
    }

    location /ml/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  "$http_origin" always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept' always;
            add_header 'Content-Length' '0';
            return 204;
        }

        proxy_pass http://ml:8083/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            "";

        add_header 'Access-Control-Allow-Origin'      "$http_origin" always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    # SPA fallback for React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
