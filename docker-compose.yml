version: "3.9"

services:
  mysql:
    image: mysql:8.0.39
    container_name: ctrl-pay-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: ctrl_pay
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change-me}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ctrl-pay-network

  ml:
    build:
      context: ./ml_fraud-detection/payment-fraud-detection-main
      dockerfile: Dockerfile
    container_name: ctrl-pay-ml
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
    command: ["flask", "--app", "app", "run", "--host=0.0.0.0", "--port=8083"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ctrl-pay-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ctrl-pay-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ctrl_pay?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: admin123
      FRAUD_API_BASE_URL: http://ml:8083
      JAVA_OPTS: -Xmx768m -Xms256m
      TZ: UTC
    depends_on:
      mysql:
        condition: service_healthy
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - ctrl-pay-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
        REACT_APP_FRAUD_API_URL: /ml
    container_name: ctrl-pay-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      ml:
        condition: service_healthy
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ctrl-pay-network

volumes:
  mysql_data:

networks:
  ctrl-pay-network:
    driver: bridge

