<!DOCTYPE html>
<html>
<head>
    <title>Payment Fraud Detection</title>
</head>

<body>

<h2>Payment Fraud Detection using XGBoost</h2>

<form action="/predict" method="post">

    <label>Amount</label><br>
    <input type="number" name="amount" step="0.01" required><br><br>

    <label>Old Balance (Sender)</label><br>
    <input type="number" name="oldbalanceOrg" step="0.01" required><br><br>

    <label>New Balance (Sender)</label><br>
    <input type="number" name="newbalanceOrig" step="0.01" required><br><br>

    <label>Old Balance (Receiver)</label><br>
    <input type="number" name="oldbalanceDest" step="0.01" required><br><br>

    <label>New Balance (Receiver)</label><br>
    <input type="number" name="newbalanceDest" step="0.01" required><br><br>

    <label>Transaction Type</label><br>

    <select name="transaction_type">

        <option value="CASH_IN">CASH_IN</option>

        <option value="CASH_OUT">CASH_OUT</option>

        <option value="DEBIT">DEBIT</option>

        <option value="PAYMENT">PAYMENT</option>

        <option value="TRANSFER">TRANSFER</option>

    </select>

    <br><br>

    <button type="submit">Predict</button>

</form>

{% if fraud is defined %}

<hr>

<h3>Prediction Result</h3>

<h2>Fraud Probability : {{ fraud }}%</h2>

<h2>Legitimate Probability : {{ safe }}%</h2>

{% endif %}

</body>
</html>
