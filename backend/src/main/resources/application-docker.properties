# ========================================
# Ctrl-Pay Docker Environment Configuration
# Used when running via docker-compose
# ========================================

# Database Configuration (MySQL Service via docker-compose)
spring.datasource.url=jdbc:mysql://mysql:3306/ctrl_pay?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=8082

# Logging for Docker (less verbose)
logging.level.root=INFO
logging.level.com.neueda=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.org.springframework=WARN

# Actuator (accessible in Docker)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
