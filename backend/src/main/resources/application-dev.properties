# ========================================
# Ctrl-Pay Development Environment Configuration
# Used for local development with local MySQL
# ========================================

# Database Configuration (Local MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/ctrl_pay?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=n3u3da!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings (Dev - smaller pool)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Schema Initialization (Dev - always init)
spring.sql.init.mode=always
spring.sql.init.platform=mysql
spring.sql.init.data-locations=classpath:schema.sql

# Logging for Development (Very Verbose)
logging.level.root=INFO
logging.level.com.neueda=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework=INFO

# Display formatted SQL
spring.jpa.properties.hibernate.format_sql=true

# Actuator (All endpoints visible in dev)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Server Configuration (Dev)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

