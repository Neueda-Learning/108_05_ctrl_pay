# ========================================
# Fraud Detection Configuration
# Phase 1: Foundation & Advanced Detection Layer
# ========================================

# Enable/disable fraud detection entirely
fraud.detection.enabled=true

# ========================================
# Hybrid Scoring Configuration
# ========================================

# Weight distribution for hybrid fraud score calculation
# Total must approximately equal 1.0
fraud.rule-weight=0.40                  # Rule engine contribution (40%)
fraud.ml-weight=0.60                    # ML model contribution (60%)

# ========================================
# Decision Thresholds
# ========================================
# Fraud scores are on 0-100 scale
# Thresholds determine how payments are routed and approved

fraud.approval-threshold=0.30            # Below 30% = auto-approve (fast track)
fraud.review-threshold=0.75              # 30-75% = manual review
fraud.auto-reject-threshold=0.95         # Above 95% = auto-reject

# ========================================
# Processing Lane SLA Configuration
# ========================================
# Service Level Agreements for each processing lane (in minutes)

fraud.sla-fast-track=5                   # Auto-approved low-risk: 5 minute SLA
fraud.sla-manual-review=60               # Manual review medium-risk: 60 minute SLA
fraud.sla-escalation=120                 # Escalation high-risk: 120 minute SLA

# ========================================
# ML Model Configuration
# ========================================

# ML service endpoint (Python Flask service)
fraud.ml-service.url=http://localhost:5000
fraud.ml-service.endpoint=/predict-json
fraud.ml-service.timeout-ms=2000
fraud.ml-service.retry-attempts=2

# Fallback behavior when ML service unavailable
fraud.ml-service.fallback-to-rules-only=true
fraud.ml-service.required-fields=["amount","oldbalanceOrg","newbalanceOrig","oldbalanceDest","newbalanceDest","transaction_type"]

# ========================================
# Rule Configuration
# ========================================

# Individual rule enable/disable flags
fraud.rule.large-transaction.enabled=true
fraud.rule.extremely-large-transaction.enabled=true
fraud.rule.account-drain.enabled=true
fraud.rule.transaction-velocity.enabled=true
fraud.rule.behavior-change.enabled=true
fraud.rule.new-destination.enabled=true
fraud.rule.multiple-failure.enabled=true
fraud.rule.suspicious-account.enabled=true
fraud.rule.cross-currency.enabled=true
fraud.rule.ml-fraud.enabled=true

# Phase 1 new rules
fraud.rule.unusual-time-pattern.enabled=true
fraud.rule.velocity-anomaly.enabled=true
fraud.rule.cyclical-pattern.enabled=true
fraud.rule.behavioral-baseline.enabled=true
fraud.rule.contextual-risk-aggregation.enabled=true

# Rule-specific thresholds (configurable)
fraud.rule.large-transaction.threshold=50000.00
fraud.rule.extremely-large-transaction.threshold=500000.00
fraud.rule.account-drain.threshold.percentage=0.8
fraud.rule.transaction-velocity.threshold.per-hour=5
fraud.rule.transaction-velocity.threshold.per-day=20

# ========================================
# Model Versioning & Deployment
# ========================================

# Active ML model version (deployed to PROD)
# This should match an entry in the ml_models table
fraud.ml-model.active-version=xgboost_paysim:1.0.0

# Model performance thresholds for auto-rollback
fraud.ml-model.min-accuracy-threshold=0.90
fraud.ml-model.min-precision-threshold=0.85
fraud.ml-model.min-recall-threshold=0.90

# ========================================
# Logging & Auditing
# ========================================

# Log level for fraud detection operations
fraud.logging.level=DEBUG

# Enable detailed rule execution logging
fraud.logging.rule-execution=true

# Enable detailed ML prediction logging
fraud.logging.ml-predictions=true

# Enable fraud audit event recording (compliance)
fraud.logging.audit-events=true

# ========================================
# Monitoring & Analytics
# ========================================

# Metrics collection
fraud.metrics.enabled=true
fraud.metrics.collection-interval-seconds=60

# Alert thresholds
fraud.alerts.high-fraud-rate-threshold=0.15    # Alert if > 15% payments flagged as fraudulent
fraud.alerts.model-accuracy-degradation=0.05  # Alert if model accuracy drops > 5%

# ========================================
# Caching Configuration (Phase 4)
# ========================================

# Cache active rules and model in memory
fraud.cache.enabled=true
fraud.cache.rules.ttl-minutes=5
fraud.cache.model.ttl-minutes=5
fraud.cache.predictions.max-size=10000

# ========================================
# Async Processing Configuration (Phase 4)
# ========================================

# Enable async fraud assessment scoring
fraud.async.enabled=false               # Disabled in Phase 1
fraud.async.thread-pool-size=10
fraud.async.queue-capacity=1000

# ========================================
# Circuit Breaker Configuration (Phase 4)
# ========================================

# ML service circuit breaker
fraud.circuit-breaker.enabled=true
fraud.circuit-breaker.failure-threshold=5        # Fail after 5 failures
fraud.circuit-breaker.success-threshold=2        # Reset after 2 successes
fraud.circuit-breaker.timeout-seconds=30         # Half-open timeout

# ========================================
# Feature Flags (for gradual rollout)
# ========================================

# Phase 1 features
feature.advanced-rules.enabled=true
feature.processing-lanes.enabled=true
feature.confidence-scoring.enabled=true
feature.ml-model-versioning.enabled=true

# Phase 2 features (disabled in Phase 1)
feature.manual-review-dashboard.enabled=false
feature.appeal-workflow.enabled=false
feature.case-management.enabled=false

# Phase 3 features (disabled in Phase 1)
feature.analytics-dashboard.enabled=false
feature.model-performance-dashboard.enabled=false
feature.anomaly-detection.enabled=false

# ========================================
# Development vs Production Overrides
# ========================================

# Profile-specific overrides are in:
# - application-dev.properties
# - application-prod.properties
# - application-docker.properties

# Example prod overrides:
# spring.profiles.active=prod
# fraud.detection.enabled=true
# fraud.logging.level=INFO          (less verbose in prod)
# fraud.ml-service.url=https://<prod-ml-service>

