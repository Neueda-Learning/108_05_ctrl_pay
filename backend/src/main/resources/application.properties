# ========================================
# Ctrl-Pay Application Configuration
# ========================================

# Application Metadata
spring.application.name=ctrl_pay
app.name=Ctrl-Pay
app.version=@project.version@
app.description=Payment Processing System REST API

# ========================================
# Database Configuration (Default: Development with Local MySQL)
# ========================================

# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/ctrl_pay?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=n3u3da!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# Schema Initialization
# Enabled to load validation rules seed data on startup
spring.sql.init.mode=always
spring.sql.init.platform=mysql
spring.sql.init.data-locations=classpath:schema.sql

# JPA/Hibernate (minimal config for JDBC usage)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ========================================
# Server Configuration
# ========================================

server.port=8080
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on-param
server.error.include-exception=false

# ========================================
# Logging Configuration
# ========================================

# Root Logger
logging.level.root=INFO

# Application Logging
logging.level.com.neueda=DEBUG

# SQL Logging (for debugging queries)
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG

# Reduce noise from Spring framework
logging.level.org.springframework=WARN
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN

# ========================================
# Spring Boot Actuator Configuration
# ========================================

# Enable actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# ========================================
# Jackson Configuration (JSON Processing)
# ========================================

# Date/Time formatting - configured in JacksonConfiguration bean
# spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ========================================
# Swagger/OpenAPI Configuration
# ========================================
# Enable Swagger UI for API documentation
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ========================================
# Scheduler Configuration (Phase 6)
# ========================================
# DISABLED - Scheduler causes transaction rollback with validation rule issues
# Set to 'true' to enable background payment processing scheduler
scheduler.enabled=true
scheduler.interval-ms=5000
scheduler.initial-delay-ms=2000
scheduler.failure-rate=0.1

# ========================================
# Payment Retry Configuration (Phase 6)
# ========================================
payment.retry.max-attempts=3
payment.retry.initial-delay-ms=1000

# Fraud ML Service Configuration (read-only risk analytics)
fraud.api.base-url=${FRAUD_API_BASE_URL:http://localhost:5000}

# ========================================
# Fraud Detection Configuration
# ========================================
fraud.detection.enabled=true
fraud.rule-weight=0.4
fraud.ml-weight=0.6
# Payments with hybrid fraud score >= 70% go to SUSPICIOUS for review
fraud.review-threshold=0.70
# Payments with hybrid fraud score >= 95% are auto-rejected
fraud.auto-reject-threshold=0.95

# Fraud Rule Weights
fraud.rule.large-transaction.weight=0.15
fraud.rule.large-transaction.threshold-percent=80

fraud.rule.extremely-large.weight=0.12
fraud.rule.extremely-large.threshold=10000

fraud.rule.account-drain.weight=0.15
fraud.rule.account-drain.minimum-balance=100

fraud.rule.velocity.weight=0.12
fraud.rule.velocity.limit-5min=5
fraud.rule.velocity.limit-24h=20

fraud.rule.behavior-change.weight=0.12
fraud.rule.behavior-change.deviation-threshold=3.0
fraud.rule.behavior-change.lookback-days=30

fraud.rule.new-destination.weight=0.10
fraud.rule.new-destination.new-account-days=30

fraud.rule.multiple-failure.weight=0.10
fraud.rule.multiple-failure.threshold=3
fraud.rule.multiple-failure.lookback-days=7

fraud.rule.suspicious-account.weight=0.20

fraud.rule.cross-currency.weight=0.08
fraud.rule.cross-currency.high-risk-threshold=5000

fraud.rule.ml-fraud.weight=0.25

# ========================================
# Profile-Specific Configuration
# ========================================
# This file is the DEFAULT profile
# Use -Dspring.profiles.active=dev|docker|prod to switch profiles
# application-dev.properties      -> Development (local MySQL)
# application-docker.properties   -> Docker Compose (MySQL via service name)
# application-prod.properties     -> Production (external MySQL host)
