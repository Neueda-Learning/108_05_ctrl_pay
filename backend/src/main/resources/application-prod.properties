# ========================================
# Ctrl-Pay Production Environment Configuration
# Used when deployed to production
# ========================================

# Database Configuration (Production MySQL Instance)
# NOTE: Use environment variables for sensitive data
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Connection Pool Settings (Production-grade)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Schema Initialization (disabled in prod, use migrations)
spring.sql.init.mode=never

# Server Configuration (Production)
server.port=8080
server.servlet.context-path=/
server.error.include-message=on-param
server.error.include-binding-errors=on-param
server.error.include-stacktrace=never
server.error.include-exception=false

# Logging for Production (Minimal)
logging.level.root=WARN
logging.level.com.neueda=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.web=INFO

# Actuator (Production - restricted endpoints)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

